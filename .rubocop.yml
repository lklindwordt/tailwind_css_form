AllCops:
  TargetRubyVersion: 2.6
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude: 
    - lib/generators/initializer/templates/initializer.rb
    - lib/tailwind_css_form/inputs/combobox_field.rb

Style/Documentation:
  Enabled: false

# Test file specific configurations
Style/OneClassPerFile:
  Exclude:
    - test/**/*

Metrics/ClassLength:
  Exclude:
    - test/**/*

Metrics/MethodLength:
  Exclude:
    - test/**/*
    - lib/tailwind_css_form/configuration.rb

Metrics/ModuleLength:
  Exclude:
    - lib/tailwind_css_form/inputs/combobox_field.rb

Metrics/BlockLength:
  Exclude:
    - lib/generators/initializer/templates/initializer.rb
    - lib/tailwind_css_form/inputs/combobox_field.rb

Metrics/AbcSize:
  Exclude:
    - lib/tailwind_css_form/configuration.rb
    - lib/tailwind_css_form/inputs/combobox_field.rb

Metrics/ParameterLists:
  Exclude:
    - lib/tailwind_css_form/inputs/combobox_field.rb

Gemspec/AttributeAssignment:
  Enabled: false
